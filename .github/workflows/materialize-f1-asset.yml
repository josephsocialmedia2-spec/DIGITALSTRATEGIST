name: Materialize verified F1 Agent Pricing asset

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/materialize-f1-asset.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify exact JPG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p campagna-email-f1/assets

          echo "bcabc4de4aad42dbef1a3051bdc877bb15f6c0ce01a76d1eca3410e2badae882  campagna-email-f1/assets-build/part-00.b64" | sha256sum -c -
          echo "ce909043739c1988fff59a64761a5a4ee7b3689ec0ef90f76afc8e1c68328909  campagna-email-f1/assets-build/part-01.b64" | sha256sum -c -
          echo "e7d4c9ecc4f0c53377529102a2847d13ac5b4fd648bf3d2424e5777310ff9f83  campagna-email-f1/assets-build/part-02.b64" | sha256sum -c -
          echo "6267aa075cf2a386ef3b302d332365074b5a8b2083ece71f469407ce3a7c5c13  campagna-email-f1/assets-build/part-03.b64" | sha256sum -c -
          echo "0de22ef041e50aaea23ae828dadfd1e4c8acbe00918a71b5d84eda60f0978087  campagna-email-f1/assets-build/part-04.b64" | sha256sum -c -
          echo "d61e2d654291f2a98b52dfd6c55a51cf7465b73b31a1e8a91e54523ac876cfc2  campagna-email-f1/assets-build/part-05.b64" | sha256sum -c -
          echo "4f9690a74723e1b373bd5955f4842a04a650ad1fdc48dc4e2f92a9747c597b97  campagna-email-f1/assets-build/part-06.b64" | sha256sum -c -

          cat campagna-email-f1/assets-build/part-*.b64 | tr -d '\r\n' | base64 --decode > campagna-email-f1/assets/vendere-casa-f1.jpg
          test "$(wc -c < campagna-email-f1/assets/vendere-casa-f1.jpg | tr -d ' ')" = "75594"
          echo "b83e56df77877f41eb0a1828daa78b0b76ff383f5f29dd321e780ccb7d69536e  campagna-email-f1/assets/vendere-casa-f1.jpg" | sha256sum -c -

      - name: Commit verified binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campagna-email-f1/assets/vendere-casa-f1.jpg
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Verified image already committed."
            exit 0
          fi
          git commit -m "Materialize verified F1 Agent Pricing image"
          git push origin HEAD:main
