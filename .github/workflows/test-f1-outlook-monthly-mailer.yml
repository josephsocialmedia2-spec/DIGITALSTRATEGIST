name: Test and package F1 Outlook Monthly Mailer

on:
  push:
    branches: [main]
    paths:
      - "f1-outlook-monthly-mailer/**"
      - ".github/workflows/test-f1-outlook-monthly-mailer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-package-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell tests
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          & ".\f1-outlook-monthly-mailer\tests\Run-Tests.ps1"

      - name: Package ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $zip = "dist\F1-Outlook-Monthly-Mailer-v1.0.0.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path ".\f1-outlook-monthly-mailer\*" -DestinationPath $zip -CompressionLevel Optimal
          Get-FileHash $zip -Algorithm SHA256 | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: F1-Outlook-Monthly-Mailer-Windows
          path: dist/F1-Outlook-Monthly-Mailer-v1.0.0.zip
          if-no-files-found: error

      - name: Publish or refresh v1.0.0 release
        if: github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v1.0.0"
          $zip = "dist\F1-Outlook-Monthly-Mailer-v1.0.0.zip"
          $oldPreference = $ErrorActionPreference
          $ErrorActionPreference = "SilentlyContinue"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $oldPreference
          if (-not $releaseExists) {
            gh release create $tag $zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "F1 Outlook Monthly Mailer v1.0.0" --notes "Windows + PowerShell + Outlook Classic. Nessun Supabase, Graph, Azure, SMTP, Python o Power Automate."
          } else {
            gh release upload $tag $zip --repo $env:GITHUB_REPOSITORY --clobber
          }
