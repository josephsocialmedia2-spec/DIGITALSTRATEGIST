name: Deploy DIGITALSTRATEGIST to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "dieta/**"
      - "campagna-email-test/**"
      - "campagna-email-f1/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site

          # Preserve the existing Dieta site at the Pages root.
          cp -a dieta/. _site/

          # Publish the email campaign as a dedicated subfolder.
          mkdir -p _site/campagna-email-test
          cp -a campagna-email-test/. _site/campagna-email-test/

          # Publish F1 campaign tools.
          mkdir -p _site/campagna-email-f1
          cp -a campagna-email-f1/. _site/campagna-email-f1/

          # Rebuild the exact Agent Pricing JPG from text chunks.
          mkdir -p _site/campagna-email-f1/assets
          cat campagna-email-f1/assets-src/vendere-casa-f1.b64.* | tr -d '\\r\\n' | base64 --decode > _site/campagna-email-f1/assets/vendere-casa-f1.jpg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
